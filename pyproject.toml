[build-system]
requires = ["setuptools<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "education-multimodal-rag"
version = "0.2.0"
description = "Production-oriented adaptive multimodal RAG for education materials."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pymilvus>=2.4",
    "PyMuPDF>=1.24",
    "unstructured[docx,pptx,pdf]>=0.16",
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "Pillow>=10.0",
    "numpy>=1.26",
    "FlagEmbedding>=1.3",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "torch>=2.2",
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "redis>=5.0",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.25"]

[project.scripts]
education-rag = "manufacturing_rag.cli:main"
manufacturing-rag = "manufacturing_rag.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
